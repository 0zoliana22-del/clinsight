name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 项目零第三方依赖，所以这一步其实是空的 —— 留着是为了证明"真的零依赖"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: End-to-end demo
        run: python run.py demo

      - name: Evaluation (fails if the engine crashes on any gold sample)
        run: python run.py eval

      # LLM 模式需要 API key，CI 里不跑；这里只验证对照装置的规则分支不会崩
      - name: A/B harness (rule baseline only)
        run: python run.py ab --modes rule

      - name: Upload generated PRDs
        uses: actions/upload-artifact@v4
        with:
          name: prd-${{ matrix.python-version }}
          path: output/PRD-*.md
          if-no-files-found: error
